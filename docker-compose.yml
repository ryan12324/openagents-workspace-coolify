services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: "https://github.com/openagents-org/openagents.git#develop:workspace/backend"
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/openagents_workspace
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: workspace_token
      IDENTITY_MODE: standalone
      CORS_ORIGINS: ${CORS_ORIGINS:-https://workspace.ryancreates.co.uk}
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "alembic upgrade head && exec ./entrypoint.sh"

  frontend:
    build:
      context: "https://github.com/openagents-org/openagents.git#develop:workspace/frontend"
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://workspace-api.ryancreates.co.uk}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
